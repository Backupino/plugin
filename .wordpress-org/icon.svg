<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Backupino">
  <defs>
    <!-- Deep Brand Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Soft Ambient Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Directional Backup Stream Gradient -->
    <linearGradient id="orbitGrad" gradientUnits="userSpaceOnUse" x1="196" y1="190" x2="128" y2="34">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.05"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.65"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="1"/>
    </linearGradient>

    <!-- Central "B" Emblem Gradient -->
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Fast-Recovery Accent Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Rounded Square Container + Subtle Inner Rim -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="250" height="250" rx="53" fill="none" stroke="#60a5fa" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Breathing Core Halo -->
  <circle cx="128" cy="128" r="96" fill="url(#coreGlow)">
    <animate attributeName="r" values="88;102;88" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer Resumable Checkpoint Track -->
  <circle cx="128" cy="128" r="94" fill="none" stroke="#3b82f6" stroke-opacity="0.28" stroke-width="4" stroke-dasharray="6 10" stroke-linecap="round"/>

  <!-- Counter-Rotating Inner Data-Chunk Ring -->
  <g>
    <circle cx="128" cy="128" r="74" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="2.5" stroke-dasharray="16 26" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="360 128 128" to="0 128 128" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- Primary Rotating Backup & Restore Orbit -->
  <g>
    <!-- Concentric 231-deg Orbital Sweep on r=94 -->
    <path d="M 205 181.92 A 94 94 0 1 1 121.44 34.23" fill="none" stroke="url(#orbitGrad)" stroke-width="9" stroke-linecap="round"/>
    <!-- Tangential Arrowhead -->
    <path d="M 141 34 L 118 21 L 124 34 L 118 47 Z" fill="#e0f2fe"/>
    <!-- Pulsing Checkpoint Data Node -->
    <circle cx="217.4" cy="98.95" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- Central Backupino "B" Emblem with True Cutout Counters -->
  <g>
    <path fill="url(#bGrad)" fill-rule="evenodd" d="
      M 88 66
      L 133 66
      C 154 66, 167 77, 167 95
      C 167 108, 159 118, 146 123
      C 162 128, 173 140, 173 159
      C 173 180, 156 190, 134 190
      L 88 190
      Z
      M 110 86
      L 130 86
      C 140 86, 146 90, 146 98
      C 146 106, 140 111, 130 111
      L 110 111
      Z
      M 110 131
      L 132 131
      C 144 131, 151 137, 151 150
      C 151 163, 144 169, 132 169
      L 110 169
      Z"/>

    <!-- Fast-Recovery Stem Chevron -->
    <polygon points="88,115 108,128 88,141" fill="url(#boltGrad)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.6s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
