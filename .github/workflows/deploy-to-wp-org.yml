name: Deploy to WordPress.org

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not commit to SVN)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-wporg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to WordPress.org Plugin Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: wp-cli
          coverage: none

      - name: Extract version from readme.txt
        id: version
        run: |
          VERSION=$(grep -i -m1 'Stable tag:' readme.txt | awk -F: '{print $2}' | tr -d ' \r\n')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}"

      - name: Update POT and compile MO translations
        run: |
          mkdir -p languages
          wp i18n make-pot . languages/backupino.pot --slug=backupino --domain=backupino
          wp i18n make-mo languages

      - name: WordPress Plugin Deploy to SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
          dry-run: ${{ inputs.dry_run == true }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: backupino
          VERSION: ${{ steps.version.outputs.version }}
          ASSETS_DIR: .wordpress-org

      - name: Upload release zip asset
        if: github.event_name == 'release' && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
