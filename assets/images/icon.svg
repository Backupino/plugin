<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Orbit Stream Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="1" />
    </linearGradient>

    <!-- "B" Gradient -->
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes backupinoOrbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes backupinoPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(96,165,250,0.4)); }
        50% { transform: scale(1.035); filter: drop-shadow(0 0 6px rgba(56,189,248,0.75)); }
      }
      @keyframes backupinoDash {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -70; }
      }
      .orbit-group {
        transform-origin: 64px 64px;
        animation: backupinoOrbit 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .center-b {
        transform-origin: 64px 64px;
        animation: backupinoPulse 2.8s ease-in-out infinite;
      }
      .orbit-trail {
        stroke-dasharray: 45 25;
        animation: backupinoDash 1.8s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Outer Track Ring (Subtle) -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#2563eb" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="4 6" />

  <!-- Rotating Backup Orbit with Arrowhead -->
  <g class="orbit-group">
    <!-- Orbital Arc -->
    <path d="M 64 16 A 48 48 0 1 1 20 78" fill="none" stroke="url(#orbitGrad)" stroke-width="4.5" stroke-linecap="round" class="orbit-trail" filter="url(#glow)" />
    <!-- Arrowhead at Head of Orbit -->
    <polygon points="64,9 73,18 64,27 67,18" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Central Backupino "B" Emblem -->
  <g class="center-b">
    <!-- Stylized Modern Letter "B" with Cloud/Shield Geometry & Data Arrow -->
    <!-- Outer B Path -->
    <path d="M 44 32
             L 66 32
             C 76 32, 83 38, 83 47
             C 83 53, 79 58, 73 61
             C 81 64, 86 70, 86 80
             C 86 91, 77 96, 65 96
             L 44 96
             Z"
          fill="url(#bGrad)"
          filter="url(#glow)" />

    <!-- Top Counter of "B" (With Cloud Curve Accent) -->
    <path d="M 54 42
             L 64 42
             C 69 42, 73 44, 73 48
             C 73 52, 69 54, 64 54
             L 54 54
             Z"
          fill="#1e3a8a" />

    <!-- Bottom Counter of "B" (Merged with Fast-Restore Arrow Notch) -->
    <path d="M 54 64
             L 65 64
             C 71 64, 76 67, 76 72
             C 76 77, 71 86, 65 86
             L 54 86
             Z"
          fill="#1e3a8a" />

    <!-- Dynamic Lightning / Fast Recovery Accent Notch on Stem -->
    <polygon points="44,58 54,64 44,70" fill="#38bdf8" opacity="0.9" />
  </g>
</svg>
